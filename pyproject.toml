[project]
name = "datargs"
requires-python = '>=3.13'
version = "1.1.0"
description = "Declarative, type-safe command line argument parsers from dataclasses and attrs classes"
authors = [{name="Roee Nizan", email="roeen30@gmail.com"}]
license-files = ['LICENSE']
keywords = ["argparse", "dataclass", "attrs"]
readme = "README.md"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    'boltons>=20.2.1',
    'typing-extensions ; python_full_version < "3.8"',
]

[project.urls]
homepage = "https://github.com/roee30/datargs"
repository = "https://github.com/roee30/datargs"

[project.optional-dependencies]
attrs = ["attrs>=20.2.0"]

[dependency-groups]
dev = [
    "black>=20.8b1",
    "pytest>=6.0.2",
    "attrs>=20.2.0",
    "ipdb>=0.13.3",
    "pdbpp>=0.10.2",
    "tox>=3.24.4",
    "tox-pyenv>=1.1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
